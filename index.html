<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro NFT Bulk Downloader & Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      padding: 30px 15px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .dashboard {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .status-box {
      font-size: 1.05rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 12px 20px -5px rgba(56, 189, 248, 0.15);
    }
    .img-wrapper {
      width: 100%;
      height: 260px;
      background: #0f172a;
      position: relative;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-info {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-info h3 {
      font-size: 1.05rem;
      color: #f8fafc;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-info .token-id {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Ethereum Mainnet NFT Downloader</h1>
    <p>কন্ট্রাক্ট: 0x4addac15971ab60ead954b8f15a67518730450e0</p>
  </header>
  
  <div class="dashboard">
    <div class="status-box" id="status">স্ট্যাটাস: ১০০০+ NFT লোডের জন্য প্রস্তুত</div>
    <div class="btn-group">
      <button id="fetchBtn" onclick="startFetching()">সবগুলো (১০০০+) লোড করুন</button>
      <button id="downloadBtn" onclick="downloadZip()" disabled>ZIP ডাউনলোড</button>
    </div>
  </div>

  <div id="nftGrid" class="grid"></div>
</div>

<script>
  const apiKey = "alch_NBTMkyeepw_LMRNNn7Ytc";
  const contractAddress = "0x4addac15971ab60ead954b8f15a67518730450e0";
  const baseUrl = `https://eth-mainnet.g.alchemy.com/v2/${apiKey}/getNFTsForContract`;

  let allNFTs = [];

  // IPFS & Cloudflare Gateways Handling for High Quality
  function fixImageUrl(url) {
    if (!url) return '';
    if (url.startsWith('ipfs://')) {
      return url.replace('ipfs://', 'https://cloudflare-ipfs.com/ipfs/');
    }
    return url;
  }

  // Fetch ALL NFTs recursively through pagination
  async function startFetching() {
    const fetchBtn = document.getElementById('fetchBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const grid = document.getElementById('nftGrid');

    fetchBtn.disabled = true;
    downloadBtn.disabled = true;
    grid.innerHTML = '';
    allNFTs = [];

    let pageKey = null;
    let pageCount = 0;

    try {
      do {
        pageCount++;
        status.innerText = `তথ্য লোড হচ্ছে... (মোট লোড হয়েছে: ${allNFTs.length} টি)`;
        
        let url = `${baseUrl}?contractAddress=${contractAddress}&withMetadata=true&limit=100`;
        if (pageKey) {
          url += `&pageKey=${pageKey}`;
        }

        const res = await fetch(url);
        const data = await res.json();

        if (data.nfts && data.nfts.length > 0) {
          data.nfts.forEach(nft => {
            allNFTs.push(nft);
            appendNFTCard(nft);
          });
        }

        pageKey = data.pageKey; // Next Page Key loop update
      } while (pageKey);

      status.innerText = `সম্পূর্ণ হয়েছে! মোট ${allNFTs.length} টি NFT ডাটাবেজ থেকে লোড করা হয়েছে।`;
      downloadBtn.disabled = false;
    } catch (err) {
      console.error(err);
      status.innerText = "ত্রুটি: ডাটা লোড করা সম্ভব হয়নি। Alchemy API লিমিট বা নেটওয়ার্ক চেক করুন।";
    } finally {
      fetchBtn.disabled = false;
    }
  }

  // Render Premium Quality Cards
  function appendNFTCard(nft) {
    const grid = document.getElementById('nftGrid');
    const card = document.createElement('div');
    card.className = 'card';

    const rawId = nft.id.tokenId;
    const decimalId = parseInt(rawId, 16);
    const title = nft.title || nft.metadata?.name || `NFT #${decimalId}`;
    
    // Priority order for High-Res Image
    let rawImg = nft.media?.[0]?.gateway || nft.metadata?.image || nft.metadata?.image_url || '';
    let imgUrl = fixImageUrl(rawImg);

    card.innerHTML = `
      <div class="img-wrapper">
        <img src="${imgUrl || 'https://via.placeholder.com/400x400?text=No+Preview'}" 
             alt="${title}" 
             loading="lazy"
             onerror="this.onerror=null;this.src='https://via.placeholder.com/400x400?text=Image+Load+Failed';">
      </div>
      <div class="card-info">
        <h3>${title}</h3>
        <span class="token-id">Token ID: #${decimalId}</span>
      </div>
    `;

    grid.appendChild(card);
  }

  // Zip Download Logic
  async function downloadZip() {
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    
    downloadBtn.disabled = true;
    status.innerText = "ZIP ফাইল তৈরি হচ্ছে... কিছুটা সময় লাগতে পারে।";

    const zip = new JSZip();
    const imgFolder = zip.folder("images");
    const metaFolder = zip.folder("metadata");

    let count = 0;

    for (let nft of allNFTs) {
      const decimalId = parseInt(nft.id.tokenId, 16);
      
      // Save Metadata JSON
      metaFolder.file(`${decimalId}.json`, JSON.stringify(nft, null, 2));

      // Get Image
      let rawImg = nft.media?.[0]?.gateway || nft.metadata?.image || '';
      let imgUrl = fixImageUrl(rawImg);

      if (imgUrl) {
        try {
          const res = await fetch(imgUrl);
          const blob = await res.blob();
          
          let ext = 'png';
          if (blob.type.includes('jpeg')) ext = 'jpg';
          else if (blob.type.includes('webp')) ext = 'webp';
          else if (blob.type.includes('gif')) ext = 'gif';

          imgFolder.file(`${decimalId}.${ext}`, blob);
        } catch (e) {
          console.warn(`ছবি ডাউনলোডে স্কিপ করা হয়েছে Token ID #${decimalId}`, e);
        }
      }

      count++;
      if(count % 10 === 0 || count === allNFTs.length) {
        status.innerText = `প্রসেস করা হচ্ছে: ${count} / ${allNFTs.length}`;
      }
    }

    status.innerText = "ZIP ফাইল কম্প্রেস করা হচ্ছে...";
    zip.generateAsync({ type: "blob" }).then(content => {
      saveAs(content, `NFT_Collection_All_${allNFTs.length}.zip`);
      status.innerText = `সফলভাবে ${allNFTs.length} টি NFT ডাউনলোড হয়েছে!`;
      downloadBtn.disabled = false;
    });
  }
</script>

</body>
</html>
