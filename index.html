<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Collection Downloader</title>
  <link rel="stylesheet" href="style.css">
  <!-- JSZip CDN for in-browser ZIP creation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>NFT COLLECTION DOWNLOADER</h1>
      <p class="subtitle">Ethereum Mainnet Contract</p>
    </header>

    <section class="config-card">
      <div class="input-group">
        <label for="apiKey">Alchemy API Key</label>
        <input type="text" id="apiKey" placeholder="Enter your Alchemy API Key" required />
      </div>

      <div class="input-group">
        <label for="contractAddress">Contract Address</label>
        <input type="text" id="contractAddress" value="0x4addac15971ab60ead954b8f15a67518730450e0" readonly />
      </div>

      <button id="loadBtn" class="btn primary-btn">Load NFTs</button>
    </section>

    <section class="status-card">
      <div class="status-header">
        <span class="status-title">Status</span>
        <span id="statusBadge" class="badge">Idle</span>
      </div>
      <p id="statusText">Ready to load NFTs.</p>
      
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="details-grid" id="detailsGrid" style="display: none;">
        <div><span>Loaded:</span> <strong id="loadCount">0 / 1000</strong></div>
        <div><span>Metadata:</span> <strong id="metaCount">0 / 0</strong></div>
        <div><span>Images:</span> <strong id="imgCount">0 / 0</strong></div>
        <div><span>Failed:</span> <strong id="failCount">0</strong></div>
      </div>
    </section>

    <div class="action-bar">
      <button id="downloadBtn" class="btn success-btn" disabled>Download All NFTs + Metadata ZIP</button>
    </div>

    <section class="gallery-section">
      <h2>NFT Gallery</h2>
      <div id="gallery" class="gallery-grid"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
