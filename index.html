<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Fetcher & Downloader</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #status {
      font-weight: bold;
      color: #facc15;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 5px;
      background-color: #0f172a;
    }
    .card h4 {
      margin: 10px 0 5px 0;
      font-size: 14px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card p {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
  <!-- JSZip and FileSaver for Zip functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

<div class="container">
  <h1>Ethereum NFT Downloader</h1>
  
  <div class="controls">
    <div>
      <span id="status">প্রস্তুত...</span>
    </div>
    <div>
      <button id="fetchBtn" onclick="fetchAllNFTs()">NFT লোড করুন</button>
      <button id="downloadBtn" onclick="downloadAsZip()" disabled>ZIP ডাউনলোড করুন</button>
    </div>
  </div>

  <div id="nftGrid" class="grid"></div>
</div>

<script>
  const apiKey = "alch_NBTMkyeepw_LMRNNn7Ytc";
  const contractAddress = "0x4addac15971ab60ead954b8f15a67518730450e0";
  const baseUrl = `https://eth-mainnet.g.alchemy.com/v2/${apiKey}/getNFTsForContract`;

  let fetchedNFTs = [];

  // IPFS URL conversion
  function resolveUrl(url) {
    if (!url) return '';
    if (url.startsWith('ipfs://')) {
      return url.replace('ipfs://', 'https://ipfs.io/ipfs/');
    }
    return url;
  }

  // Fetch all NFTs using Pagination
  async function fetchAllNFTs() {
    const fetchBtn = document.getElementById('fetchBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const grid = document.getElementById('nftGrid');

    fetchBtn.disabled = true;
    downloadBtn.disabled = true;
    grid.innerHTML = '';
    fetchedNFTs = [];

    let pageKey = null;
    let totalLoaded = 0;

    try {
      do {
        status.innerText = `তথ্য লোড হচ্ছে... (মোট: ${totalLoaded})`;
        
        let url = `${baseUrl}?contractAddress=${contractAddress}&withMetadata=true`;
        if (pageKey) {
          url += `&pageKey=${pageKey}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if (data.nfts && data.nfts.length > 0) {
          for (let nft of data.nfts) {
            fetchedNFTs.push(nft);
            renderNFTCard(nft);
          }
          totalLoaded = fetchedNFTs.length;
        }

        pageKey = data.pageKey;
      } while (pageKey);

      status.innerText = `সম্পূর্ণ হয়েছে! মোট ${totalLoaded} টি NFT পাওয়া গেছে।`;
      if (fetchedNFTs.length > 0) {
        downloadBtn.disabled = false;
      }
    } catch (error) {
      console.error(error);
      status.innerText = "ডাটা লোড করতে সমস্যা হয়েছে।";
    } finally {
      fetchBtn.disabled = false;
    }
  }

  // Render NFT Card
  function renderNFTCard(nft) {
    const grid = document.getElementById('nftGrid');
    const card = document.createElement('div');
    card.className = 'card';

    const tokenId = parseInt(nft.id.tokenId, 16); // Convert Hex to Decimal
    const title = nft.title || `NFT #${tokenId}`;
    
    // Image fallback priority
    let imageUrl = nft.media?.[0]?.gateway || nft.metadata?.image || '';
    imageUrl = resolveUrl(imageUrl);

    card.innerHTML = `
      <img src="${imageUrl || 'https://via.placeholder.com/200?text=No+Image'}" alt="${title}" onerror="this.src='https://via.placeholder.com/200?text=Image+Error'">
      <h4>${title}</h4>
      <p>ID: ${tokenId}</p>
    `;

    grid.appendChild(card);
  }

  // Download Images & Metadata in a ZIP File
  async function downloadAsZip() {
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    
    downloadBtn.disabled = true;
    status.innerText = "ZIP ফাইল তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";

    const zip = new JSZip();
    const imagesFolder = zip.folder("images");
    const metadataFolder = zip.folder("metadata");

    let completed = 0;

    for (let nft of fetchedNFTs) {
      const tokenId = parseInt(nft.id.tokenId, 16);
      
      // Save Metadata JSON
      metadataFolder.file(`${tokenId}.json`, JSON.stringify(nft, null, 2));

      // Fetch and Save Image
      let imageUrl = nft.media?.[0]?.gateway || nft.metadata?.image || '';
      imageUrl = resolveUrl(imageUrl);

      if (imageUrl) {
        try {
          const imageResponse = await fetch(imageUrl);
          const blob = await imageResponse.blob();
          
          // Extension detection based on content type
          let ext = 'png';
          if (blob.type.includes('jpeg')) ext = 'jpg';
          else if (blob.type.includes('gif')) ext = 'gif';
          else if (blob.type.includes('svg')) ext = 'svg';

          imagesFolder.file(`${tokenId}.${ext}`, blob);
        } catch (err) {
          console.error(`ছবি ডাউনলোড করতে ব্যর্থ Token ID ${tokenId}:`, err);
        }
      }

      completed++;
      status.innerText = `ZIP তৈরি হচ্ছে: ${completed} / ${fetchedNFTs.length}`;
    }

    status.innerText = "ZIP ফাইল কম্প্রেস করা হচ্ছে...";
    zip.generateAsync({ type: "blob" }).then(function(content) {
      saveAs(content, `NFT_Collection_${contractAddress}.zip`);
      status.innerText = "ডাউনলোড সফল হয়েছে!";
      downloadBtn.disabled = false;
    });
  }
</script>

</body>
</html>
